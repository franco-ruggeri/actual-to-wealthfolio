[project]
name = "actual_to_wealthfolio"
version = "0.1.0"
description = "Convert Actual Budget CSV exports to Wealthfolio-compatible format"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.13"
dependencies = ["pandas>=3.0.1"]

[project.scripts]
actual-to-wealthfolio = "actual_to_wealthfolio.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/actual_to_wealthfolio"]

[tool.ruff]
line-length = 120

[dependency-groups]
dev = [
  "basedpyright>=1.38.3",
  "mypy>=1.19.1",
  "pandas-stubs>=3.0.0.260204",
  "pytest>=8.4.2",
  "ruff>=0.15.7",
]

[project]
name = "actual-wealthfolio-sync"
version = "0.1.0"
description = "Synchronization tool for Actual Budget and Wealthfolio"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pandas>=3.0.1",
]

[project.scripts]
actual-wealthfolio-sync = "actual_wealthfolio_sync.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/actual_wealthfolio_sync"]

[project]
name = "actual_to_wealthfolio"
dynamic = ["version"]
description = "Convert Actual Budget CSV exports to Wealthfolio-compatible format"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Franco Ruggeri" }]
requires-python = ">=3.13"
dependencies = ["pandas>=3.0.1", "pyyaml>=6.0"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.13",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/franco-ruggeri/actual-to-wealthfolio"
Repository = "https://github.com/franco-ruggeri/actual-to-wealthfolio"
Issues = "https://github.com/franco-ruggeri/actual-to-wealthfolio/issues"

[project.scripts]
actual-to-wealthfolio = "actual_to_wealthfolio.main:main"

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.wheel]
packages = ["src/actual_to_wealthfolio"]

[tool.ruff]
line-length = 120

[dependency-groups]
dev = [
  "basedpyright>=1.38.3",
  "mypy>=1.19.1",
  "pandas-stubs>=3.0.0.260204",
  "pytest>=8.4.2",
  "ruff>=0.15.7",
  "types-PyYAML>=6.0",
]
